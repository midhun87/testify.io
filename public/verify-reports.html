<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verified Student Record - TESTIFY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Print Styles to ensure clean output */
        @media print {
            body { background-color: white !important; }
            nav, .print-hide { display: none !important; }
            .max-w-2xl { max-width: 100% !important; padding: 0 !important; margin: 0 auto !important; }
            .shadow-sm { box-shadow: none !important; border: 1px solid #e2e8f0 !important; }
            .bg-slate-50 { background-color: #f8fafc !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .bg-white { background-color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-12">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b border-slate-200 px-4 py-3 flex justify-center">
        <h1 class="text-xl font-extrabold text-indigo-900 tracking-wider">TESTIFY <span class="font-medium text-slate-400 text-sm tracking-normal">| Verification Portal</span></h1>
    </nav>

    <div class="max-w-2xl mx-auto px-4 pt-6">

        <!-- Loading State -->
        <div id="loading-state" class="text-center py-20">
            <svg class="animate-spin h-10 w-10 mx-auto mb-4 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-slate-500 font-medium">Fetching secure records...</p>
        </div>

        <!-- Error State -->
        <div id="error-state" class="hidden text-center py-12 px-6 bg-red-50 border border-red-100 rounded-2xl shadow-sm mt-8">
            <svg class="w-12 h-12 text-red-400 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            <h3 class="text-lg font-bold text-red-800 mb-1">Verification Failed</h3>
            <p id="error-message" class="text-red-600 text-sm">Invalid QR Code or student not found.</p>
        </div>

        <!-- Main Content (Hidden until loaded) -->
        <div id="main-content" class="hidden space-y-6">
            
            <!-- Student Profile Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden relative">
                <!-- Cover Banner -->
                <div class="h-24 bg-gradient-to-r from-indigo-600 to-purple-600 w-full print:bg-slate-200"></div>
                
                <div class="px-6 pb-6 relative">
                    <!-- Avatar -->
                    <img id="verify-avatar" src="" alt="Profile" class="w-20 h-20 rounded-full border-4 border-white shadow-md absolute -top-10 object-cover bg-slate-100">
                    
                    <div class="mt-12 sm:mt-2 sm:ml-24 flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                        <div>
                            <h2 id="verify-name" class="text-2xl font-bold text-slate-900 tracking-tight">Student Name</h2>
                            <p id="verify-email" class="text-slate-500 text-sm font-medium">student@email.com</p>
                            
                            <!-- College Info -->
                            <div class="flex items-center gap-2 mt-3 text-sm text-slate-600 bg-slate-50 py-1.5 px-3 rounded-lg border border-slate-100 inline-flex">
                                <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                                <span id="verify-college" class="font-medium">University Name</span>
                            </div>
                        </div>

                        <!-- Verification Badge -->
                        <div class="inline-flex items-center gap-1.5 bg-green-50 border border-green-200 text-green-700 px-3 py-1.5 rounded-full text-xs font-bold shadow-sm self-start">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                            Verified Identity
                        </div>
                    </div>
                </div>
            </div>

            <!-- Reports Section -->
            <div>
                <!-- Header with Print Button -->
                <div class="flex justify-between items-center mb-4 px-1">
                    <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        Assessment Records
                    </h3>
                    <button onclick="window.print()" class="print-hide flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                        Print Report
                    </button>
                </div>
                
                <ul id="reports-list" class="space-y-4">
                    <!-- Reports will be injected here via JS -->
                </ul>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email');
            
            if(!email) {
                showError("Invalid QR Code: No student email identifier found.");
                return;
            }

            try {
                // Call the updated backend endpoint
                const response = await fetch(`/api/public/reports/${encodeURIComponent(email)}`);
                const data = await response.json();

                if (!response.ok) throw new Error(data.message || 'Failed to fetch student records.');

                // Populate UI with new Student Details
                document.getElementById('verify-name').textContent = data.studentName;
                document.getElementById('verify-email').textContent = data.studentEmail;
                document.getElementById('verify-college').textContent = data.college;
                document.getElementById('verify-avatar').src = data.profileImageUrl;

                // Handle Reports List
                const list = document.getElementById('reports-list');
                list.innerHTML = ''; // Clear previous

                if(!data.reports || data.reports.length === 0) {
                    list.innerHTML = `
                        <div class="text-center bg-white rounded-xl border border-slate-200 p-8">
                            <p class="text-slate-500">No test records found for this student.</p>
                        </div>`;
                } else {
                    data.reports.forEach(report => {
                        const date = new Date(report.submittedAt).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                        const passed = report.totalScore >= (report.passingScore || 40);
                        
                        // Handle formatting missing scores gracefully
                        const codingScore = report.codingScore !== undefined ? report.codingScore : 'N/A';
                        const codeSpaceScore = report.codeSpaceScore !== undefined ? report.codeSpaceScore : 'N/A';
                        const sqlScore = report.sqlScore !== undefined ? report.sqlScore : 'N/A';
                        
                        list.innerHTML += `
                            <li class="bg-white border border-slate-200 rounded-xl shadow-sm hover:shadow-md transition overflow-hidden print:shadow-none print:break-inside-avoid">
                                <div class="p-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div class="flex-1">
                                        <h4 class="font-bold text-slate-800 text-lg leading-tight">${report.testTitle}</h4>
                                        <p class="text-sm text-slate-500 mt-1 flex items-center gap-1">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                            Submitted: ${date}
                                        </p>
                                    </div>
                                    
                                    <span class="px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wide border ${passed ? 'bg-green-50 border-green-200 text-green-700' : 'bg-red-50 border-red-200 text-red-700'}">
                                        ${passed ? 'PASSED' : 'FAILED'}
                                    </span>
                                </div>
                                
                                <!-- Scores Breakdown Grid (4 columns) -->
                                <div class="bg-slate-50 border-t border-slate-100 p-4 grid grid-cols-2 sm:grid-cols-4 gap-4 divide-y sm:divide-y-0 sm:divide-x divide-slate-200">
                                    <div class="text-center pb-2 sm:pb-0">
                                        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1">Total Score</p>
                                        <p class="font-bold text-xl text-indigo-700">${report.totalScore}</p>
                                    </div>
                                    <div class="text-center pb-2 sm:pb-0">
                                        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1">Coding</p>
                                        <p class="font-bold text-xl text-purple-600">${codingScore}</p>
                                    </div>
                                    <div class="text-center pt-2 sm:pt-0">
                                        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1">Code Space</p>
                                        <p class="font-bold text-xl text-blue-600">${codeSpaceScore}</p>
                                    </div>
                                    <div class="text-center pt-2 sm:pt-0">
                                        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1">SQL Score</p>
                                        <p class="font-bold text-xl text-teal-600">${sqlScore}</p>
                                    </div>
                                </div>
                            </li>
                        `;
                    });
                }

                // Show Content
                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');

            } catch (err) {
                showError(err.message);
            }
        });

        function showError(message) {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('error-state').classList.remove('hidden');
            document.getElementById('error-message').textContent = message;
        }
    </script>
</body>
</html>
