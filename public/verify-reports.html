<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Student Reports - TESTIFY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">
    <div class="max-w-3xl mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-indigo-900 tracking-wider">TESTIFY</h1>
            <p class="text-gray-500 mt-2">Verified Student Assessment Record</p>
        </div>

        <div class="bg-white rounded-2xl shadow-lg border border-gray-200 overflow-hidden">
            <div class="bg-indigo-50 p-6 border-b border-indigo-100 flex items-center gap-4">
                <div class="w-16 h-16 bg-indigo-200 rounded-full flex items-center justify-center text-indigo-700 font-bold text-xl">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-gray-900" id="verify-email">Loading...</h2>
                    <span class="inline-flex items-center gap-1 text-xs font-medium text-green-700 bg-green-100 px-2 py-1 rounded-md mt-1">
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>
                        Verified Identity
                    </span>
                </div>
            </div>

            <div class="p-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Academic Reports</h3>
                
                <div id="loading-state" class="text-center py-10 text-gray-400">
                    <svg class="animate-spin h-8 w-8 mx-auto mb-3 text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    Fetching records from database...
                </div>

                <div id="error-state" class="hidden text-center py-8 text-red-500 bg-red-50 rounded-lg"></div>
                <ul id="reports-list" class="space-y-4 hidden"></ul>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email');
            
            if(!email) {
                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('error-state').classList.remove('hidden');
                document.getElementById('error-state').textContent = "Invalid QR Code: No student email found.";
                document.getElementById('verify-email').textContent = "Unknown User";
                return;
            }

            document.getElementById('verify-email').textContent = email;

            try {
                const response = await fetch(`/api/public/reports/${encodeURIComponent(email)}`);
                const data = await response.json();

                document.getElementById('loading-state').classList.add('hidden');

                if (!response.ok) throw new Error(data.message || 'Failed to fetch reports');

                const list = document.getElementById('reports-list');
                list.classList.remove('hidden');

                if(data.reports.length === 0) {
                    list.innerHTML = `<li class="text-center text-gray-500 py-4">No test records found for this student.</li>`;
                    return;
                }

                data.reports.forEach(report => {
                    const date = new Date(report.submittedAt).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                    const passed = report.score >= (report.passingScore || 40);
                    
                    list.innerHTML += `
                        <li class="p-4 border border-gray-100 rounded-xl bg-white hover:shadow-md transition flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <div>
                                <h4 class="font-bold text-gray-800">${report.testTitle || 'Assessment'}</h4>
                                <p class="text-xs text-gray-500 mt-1">Submitted: ${date}</p>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="text-right">
                                    <div class="text-sm text-gray-500">Score</div>
                                    <div class="font-bold text-lg text-indigo-600">${report.score}</div>
                                </div>
                                <span class="px-3 py-1 rounded-full text-xs font-bold ${passed ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                                    ${passed ? 'PASS' : 'FAIL'}
                                </span>
                            </div>
                        </li>
                    `;
                });
            } catch (err) {
                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('error-state').classList.remove('hidden');
                document.getElementById('error-state').textContent = err.message;
            }
        });
    </script>
</body>
</html>
