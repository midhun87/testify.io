<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - TESTIFY</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dpz44zf0z/image/upload/v1756037774/Gemini_Generated_Image_eu0ib0eu0ib0eu0i_z0amjh.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom animations for ambient background blobs */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }
        
        /* Hide scrollbar but keep functionality if needed on very small screens */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-[#f8f9fc] text-gray-800 antialiased selection:bg-indigo-500 selection:text-white relative min-h-screen overflow-x-hidden">

    <!-- Ambient Mobile Background Elements -->
    <div class="fixed inset-0 z-0 lg:hidden overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-72 h-72 bg-indigo-300 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob"></div>
        <div class="absolute top-[20%] right-[-10%] w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-72 h-72 bg-blue-300 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob animation-delay-4000"></div>
    </div>

    <div class="flex min-h-screen relative z-10">
        <!-- Left Side (Desktop Only) -->
        <div class="hidden lg:flex w-1/2 items-center justify-center bg-white p-12 relative overflow-hidden border-r border-gray-100 shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-20">
            <div class="absolute top-0 left-0 w-96 h-96 bg-indigo-50/80 rounded-full -translate-x-1/3 -translate-y-1/3 filter blur-3xl"></div>
            <div class="absolute bottom-0 right-0 w-[30rem] h-[30rem] bg-violet-50/80 rounded-full translate-x-1/3 translate-y-1/3 filter blur-3xl"></div>
            
            <div class="text-center z-10 max-w-lg">
                <img src="https://res.cloudinary.com/dpz44zf0z/image/upload/v1756037774/Gemini_Generated_Image_eu0ib0eu0ib0eu0i_z0amjh.png" alt="TESTIFY Logo" class="w-32 h-32 mx-auto mb-6 drop-shadow-xl transition-transform duration-500 hover:scale-105">
                <h1 class="text-5xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-gray-900 to-gray-700">TESTIFY</h1>
                <p class="mt-4 text-xl text-gray-500 font-medium">The professional platform for secure online assessments.</p>
                
                <div class="mt-12 p-2 bg-white/50 backdrop-blur-sm rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] border border-white/80">
                     <img src="https://res.cloudinary.com/dpz44zf0z/image/upload/v1757066742/Gemini_Generated_Image_njiwz6njiwz6njiw_1_zziakv.png" alt="Platform Screenshot" class="w-full rounded-xl mx-auto">
                </div>
                <p class="mt-8 p-4 bg-gradient-to-r from-indigo-50 to-violet-50 text-indigo-800 rounded-2xl font-semibold text-center text-sm border border-indigo-100/50 shadow-sm">
                    ✨ Code, Compile, Conquer: Your Interview Journey Starts Here.
                </p>
            </div>
        </div>

        <!-- Right Side (Login Form) -->
        <div class="w-full lg:w-1/2 flex items-center justify-center p-4 sm:p-8 lg:p-12 relative">
            <div class="w-full max-w-[26rem] sm:max-w-md w-full perspective-1000">
                
                <!-- Mobile Header -->
                <div class="lg:hidden text-center mb-8 relative z-10">
                    <div class="inline-block p-3 bg-white/30 backdrop-blur-md rounded-3xl shadow-sm border border-white/40 mb-3">
                        <img src="https://res.cloudinary.com/dpz44zf0z/image/upload/v1756037774/Gemini_Generated_Image_eu0ib0eu0ib0eu0i_z0amjh.png" alt="TESTIFY Logo" class="w-16 h-16 object-contain">
                    </div>
                    <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">TESTIFY</h1>
                </div>

                <!-- Form Card -->
                <div class="bg-white/70 sm:bg-white backdrop-blur-2xl sm:backdrop-blur-none p-6 sm:p-10 rounded-[2.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] sm:shadow-2xl border border-white/60 sm:border-gray-100 relative z-10 transition-all duration-300">
                    
                    <div class="text-center mb-8">
                        <h2 class="text-3xl font-bold text-gray-900 tracking-tight">Welcome Back</h2>
                        <p class="text-gray-500 mt-2 text-sm font-medium">Please enter your details to sign in.</p>
                    </div>

                    <form id="login-form" class="space-y-5">
                        <div class="relative group">
                            <label for="email" class="block mb-1.5 text-sm font-semibold text-gray-700 ml-1">Email</label>
                            <div class="absolute bottom-0 left-0 top-7 flex items-center pl-4 pointer-events-none transition-colors group-focus-within:text-indigo-600 text-gray-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                            </div>
                            <input type="email" id="email" name="email" required placeholder="name@company.com" 
                                class="w-full pl-12 pr-4 h-14 bg-white sm:bg-gray-50/50 border border-gray-200/80 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all duration-300 placeholder-gray-400 text-gray-900 font-medium outline-none shadow-sm shadow-gray-100/50">
                        </div>
                        
                        <div class="relative group">
                            <div class="flex justify-between items-center mb-1.5 ml-1 mr-1">
                                <label for="password" class="block text-sm font-semibold text-gray-700">Password</label>
                                <a href="forgot-password.html" class="text-xs font-bold text-indigo-600 hover:text-indigo-800 transition-colors">Forgot?</a>
                            </div>
                             <div class="absolute bottom-0 left-0 h-14 flex items-center pl-4 pointer-events-none transition-colors group-focus-within:text-indigo-600 text-gray-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            </div>
                            <input type="password" id="password" name="password" required placeholder="••••••••" 
                                class="w-full pl-12 pr-4 h-14 bg-white sm:bg-gray-50/50 border border-gray-200/80 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all duration-300 placeholder-gray-400 text-gray-900 font-medium outline-none shadow-sm shadow-gray-100/50">
                        </div>
                        
                        <button type="submit" class="w-full mt-2 bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold h-14 rounded-2xl hover:from-indigo-500 hover:to-violet-500 focus:outline-none focus:ring-4 focus:ring-indigo-500/30 transition-all duration-300 transform active:scale-[0.98] shadow-[0_8px_20px_rgb(79,70,229,0.25)] flex items-center justify-center gap-2">
                            Sign In
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </form>

                    <div id="message" class="hidden text-center mt-4 p-3 rounded-xl font-medium text-sm"></div>

                    <!-- Modern Divider -->
                    <div class="relative flex py-8 items-center">
                        <div class="flex-grow border-t border-gray-200"></div>
                        <span class="flex-shrink mx-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Moderator Access</span>
                        <div class="flex-grow border-t border-gray-200"></div>
                    </div>
                    
                    <!-- Sleek Secondary Actions -->
                    <div class="grid grid-cols-2 gap-3 mt-1">
                        <a href="hiring/hiring-moderator-login.html" class="group flex flex-col items-center justify-center text-center bg-white sm:bg-gray-50/50 border border-gray-200/80 text-gray-600 hover:text-indigo-600 py-3 px-2 rounded-2xl hover:bg-indigo-50 hover:border-indigo-100 transition-all duration-300">
                            <svg class="w-5 h-5 mb-1 text-gray-400 group-hover:text-indigo-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                            <span class="text-xs font-bold">Hiring Mod</span>
                        </a>
                        <a href="quizcom/quiz-moderator-login.html" class="group flex flex-col items-center justify-center text-center bg-white sm:bg-gray-50/50 border border-gray-200/80 text-gray-600 hover:text-purple-600 py-3 px-2 rounded-2xl hover:bg-purple-50 hover:border-purple-100 transition-all duration-300">
                            <svg class="w-5 h-5 mb-1 text-gray-400 group-hover:text-purple-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                            <span class="text-xs font-bold">Quiz Mod</span>
                        </a>
                    </div>

                    <div class="mt-8 text-center space-y-2">
                        <p class="text-sm text-gray-500 font-medium">
                            Don't have an account? <a href="signup.html" class="font-bold text-indigo-600 hover:text-indigo-800 transition-colors">Sign Up</a>
                        </p>
                        <p class="text-xs text-gray-400 font-medium pt-2">
                            <a href="welcome.html" class="hover:text-gray-600 transition-colors flex items-center justify-center gap-1">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                                Back to Home
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
