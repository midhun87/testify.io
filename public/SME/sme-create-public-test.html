<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SME - Create Public Test | Hire With Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar-link:hover { background-color: #4338CA; }
        .sidebar-link.active { background-color: #4F46E5; font-weight: 600; }
        
        /* Custom scrollbar for builder */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c7c7cc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }
    </style>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <div class="hidden md:flex flex-col w-64 bg-gray-900 text-white flex-shrink-0">
        <div class="flex items-center justify-center h-20 border-b border-gray-800">
            <span class="text-xl font-bold tracking-wider">HIRE WITH US</span>
        </div>
        <nav class="flex-grow p-4 overflow-y-auto" id="sidebar-nav">
            <!-- Included by sme-common.js -->
            <a href="sme-dashboard.html" class="sidebar-link flex items-center py-3 px-4 rounded-lg text-gray-300 hover:text-white">Dashboard</a>
            <a href="#" class="sidebar-link active flex items-center py-3 px-4 rounded-lg text-white">Create Public Test</a>
        </nav>
    </div>

    <!-- Main content -->
    <div class="flex flex-col flex-1 overflow-y-auto w-full">
        <div class="flex items-center justify-between h-20 bg-white border-b border-gray-200 px-8 sticky top-0 z-10 shadow-sm">
            <h1 class="text-2xl font-bold text-gray-800">Create Public Assessment</h1>
            <div id="user-menu-container">
                <span class="font-semibold text-gray-700">SME User</span>
            </div>
        </div>

        <div class="p-4 md:p-8 w-full max-w-5xl mx-auto">
            <form id="create-public-test-form" class="space-y-8">
                
                <!-- Global Settings -->
                <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200">
                    <div class="border-b border-gray-200 pb-4 mb-6">
                        <h2 class="text-xl font-bold text-gray-900">Assessment Metadata</h2>
                        <p class="text-sm text-gray-500">Define the core properties of this public test.</p>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Test Type</label>
                            <select id="testType" class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="practice">Practice Test (Free, Instant Access)</option>
                                <option value="mock">Mock Test (Paid, Voucher & Scheduled)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Test Title</label>
                            <input type="text" id="testTitle" required placeholder="e.g., Advanced React Patterns" class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Domain</label>
                            <input type="text" id="testDomain" required placeholder="e.g., Frontend Development" class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Key Skills (Comma separated)</label>
                            <input type="text" id="testSkills" required placeholder="React, Context API, Hooks" class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Description</label>
                            <textarea id="testDescription" required rows="2" class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Builder Area -->
                <div>
                    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-6">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-900">Curriculum Builder</h2>
                            <p class="text-sm text-gray-500">Add sections, timers, and specific question types.</p>
                        </div>
                        <button type="button" onclick="addSection()" class="mt-4 sm:mt-0 px-5 py-2.5 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 shadow-sm flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            Add Section
                        </button>
                    </div>

                    <div id="sections-container" class="space-y-6">
                        <!-- Sections will be injected here -->
                    </div>
                </div>

                <!-- Submission -->
                <div class="flex items-center justify-between pt-6 border-t border-gray-200">
                    <div id="status-message" class="text-sm font-medium"></div>
                    <button type="submit" class="px-8 py-3 bg-green-600 text-white font-bold rounded-lg shadow-lg hover:bg-green-700 transition-all focus:ring-4 focus:ring-green-300">
                        Publish Assessment
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let sectionCount = 0;

        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        function addSection() {
            sectionCount++;
            const sectionId = `sec_${generateId()}`;
            
            const sectionHTML = `
                <div id="${sectionId}" class="bg-white p-6 rounded-xl shadow-md border border-gray-200 section-block">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex-1 mr-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Section Title</label>
                                <input type="text" class="section-title w-full px-3 py-2 border-b-2 border-gray-300 focus:border-indigo-600 bg-transparent outline-none font-bold text-lg" placeholder="e.g., Aptitude" required>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Timer (Minutes)</label>
                                <input type="number" class="section-timer w-full px-3 py-2 border-b-2 border-gray-300 focus:border-indigo-600 bg-transparent outline-none text-lg" placeholder="15" required min="1">
                            </div>
                        </div>
                        <button type="button" onclick="document.getElementById('${sectionId}').remove()" class="text-red-500 hover:text-red-700 p-2 bg-red-50 rounded-lg">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>

                    <div class="questions-container space-y-4 mt-6"></div>

                    <button type="button" onclick="addQuestion('${sectionId}')" class="mt-4 px-4 py-2 text-sm text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-md font-semibold w-full border border-dashed border-indigo-300">
                        + Add Question to Section
                    </button>
                </div>
            `;
            
            document.getElementById('sections-container').insertAdjacentHTML('beforeend', sectionHTML);
            addQuestion(sectionId); // Add one question by default
        }

        function addQuestion(sectionId) {
            const container = document.querySelector(`#${sectionId} .questions-container`);
            const qId = `q_${generateId()}`;
            
            const questionHTML = `
                <div id="${qId}" class="question-block border border-gray-200 rounded-lg p-4 bg-gray-50 relative">
                    <button type="button" onclick="document.getElementById('${qId}').remove()" class="absolute top-4 right-4 text-gray-400 hover:text-red-500">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                    
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4 pr-8">
                        <div class="md:col-span-3">
                            <textarea class="q-text w-full px-3 py-2 border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500 outline-none resize-y" rows="2" placeholder="Enter question text here..." required></textarea>
                        </div>
                        <div>
                            <select class="q-type w-full px-3 py-2 border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500 outline-none text-sm bg-white" onchange="renderOptionsArea('${qId}')">
                                <option value="single">Single Correct</option>
                                <option value="multi">Multi Correct</option>
                                <option value="fill">Fill in the Blanks</option>
                            </select>
                        </div>
                    </div>
                    <div class="options-area" id="opts_${qId}"></div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', questionHTML);
            renderOptionsArea(qId);
        }

        function renderOptionsArea(qId) {
            const block = document.getElementById(qId);
            const type = block.querySelector('.q-type').value;
            const optionsArea = block.querySelector('.options-area');
            
            optionsArea.innerHTML = ''; // Clear

            if (type === 'single' || type === 'multi') {
                const inputType = type === 'single' ? 'radio' : 'checkbox';
                const inputName = type === 'single' ? `radio_${qId}` : '';
                
                optionsArea.innerHTML = `
                    <div class="space-y-2 opt-list">
                        ${[1, 2, 3, 4].map(i => `
                            <div class="flex items-center gap-3">
                                <input type="${inputType}" name="${inputName}" class="opt-check w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                                <input type="text" class="opt-text flex-1 px-3 py-1 border border-gray-300 rounded text-sm focus:border-indigo-500 outline-none" placeholder="Option ${i}" required>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (type === 'fill') {
                optionsArea.innerHTML = `
                    <div class="flex flex-col gap-2">
                        <label class="text-xs text-gray-500 font-semibold uppercase">Accepted Answers (Comma separated)</label>
                        <input type="text" class="fill-answers w-full px-3 py-2 border border-gray-300 rounded text-sm focus:border-indigo-500 outline-none" placeholder="e.g., 80, eighty" required>
                        <p class="text-xs text-gray-400">If multiple answers are correct, separate them with commas.</p>
                    </div>
                `;
            }
        }

        // Handle Submission
        document.getElementById('create-public-test-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('status-message');
            msg.textContent = 'Processing...';
            msg.className = 'text-sm font-medium text-blue-600';

            const payload = {
                type: document.getElementById('testType').value,
                title: document.getElementById('testTitle').value,
                domain: document.getElementById('testDomain').value,
                skills: document.getElementById('testSkills').value.split(',').map(s => s.trim()),
                description: document.getElementById('testDescription').value,
                sections: []
            };

            const sectionBlocks = document.querySelectorAll('.section-block');
            if (sectionBlocks.length === 0) {
                msg.textContent = 'Please add at least one section.';
                msg.className = 'text-sm font-medium text-red-600';
                return;
            }

            sectionBlocks.forEach(sec => {
                const sectionData = {
                    title: sec.querySelector('.section-title').value,
                    timer: parseInt(sec.querySelector('.section-timer').value),
                    questions: []
                };

                const qBlocks = sec.querySelectorAll('.question-block');
                qBlocks.forEach(qb => {
                    const qType = qb.querySelector('.q-type').value;
                    const qData = {
                        question: qb.querySelector('.q-text').value,
                        type: qType,
                    };

                    if (qType === 'single' || qType === 'multi') {
                        const opts = [];
                        qb.querySelectorAll('.opt-list .flex').forEach((row, idx) => {
                            opts.push({
                                text: row.querySelector('.opt-text').value,
                                isCorrect: row.querySelector('.opt-check').checked
                            });
                        });
                        qData.options = opts;
                    } else if (qType === 'fill') {
                        qData.acceptedAnswers = qb.querySelector('.fill-answers').value.split(',').map(s => s.trim().toLowerCase());
                    }
                    sectionData.questions.push(qData);
                });
                payload.sections.push(sectionData);
            });

            // MOCK API CALL for preview purposes
            console.log("Submitting Payload to /api/sme/public-tests:", payload);
            
            setTimeout(() => {
                msg.textContent = 'Test Published Successfully!';
                msg.className = 'text-sm font-medium text-green-600';
                e.target.reset();
                document.getElementById('sections-container').innerHTML = '';
            }, 1000);
        });

        // Initialize with one empty section
        window.onload = addSection;
    </script>
</body>
</html>
