<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - TESTIFY</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dpz44zf0z/image/upload/v1756037774/Gemini_Generated_Image_eu0ib0eu0ib0eu0i_z0amjh.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <!-- Libraries for ID Card Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar-link { transition: all 0.2s ease-in-out; }
        .sidebar-link:hover { background-color: rgba(255, 255, 255, 0.1); transform: translateX(4px); }
        .sidebar-link.active { background-color: rgba(255, 255, 255, 0.2); font-weight: 600; }
        
        /* ID Card hidden container styling */
        #id-card-export-container {
            position: absolute;
            left: -9999px;
            top: 0;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-indigo-900 text-white flex flex-col hidden md:flex">
        <div class="p-6 text-center text-2xl font-bold border-b border-indigo-800 tracking-wider">
            TESTIFY
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="student-dashboard.html" class="sidebar-link block p-3 rounded-lg text-indigo-200">Dashboard</a>
            <a href="student-profile.html" class="sidebar-link active block p-3 rounded-lg bg-white/10 text-white">My Profile</a>
            <a href="student-tests.html" class="sidebar-link block p-3 rounded-lg text-indigo-200">My Tests</a>
            <a href="student-reports.html" class="sidebar-link block p-3 rounded-lg text-indigo-200">Reports</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-y-auto relative">
        
        <!-- Header -->
        <header class="bg-white shadow-sm p-4 flex justify-between items-center sticky top-0 z-10">
            <div class="flex items-center gap-4">
                <button class="md:hidden text-gray-600 hover:text-indigo-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <h1 class="text-xl font-bold text-gray-800">Student Profile</h1>
            </div>

            <!-- NEW ID CARD BUTTON ADDED HERE -->
            <button onclick="generateIDCard()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Generate ID Card
            </button>
        </header>

        <!-- Profile Details Section -->
        <div class="p-6 max-w-4xl mx-auto w-full">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 flex flex-col md:flex-row gap-8 items-center md:items-start relative">
                
                <!-- Profile Image with Edit Button -->
                <div class="relative group">
                    <img id="profile-image" src="https://ui-avatars.com/api/?name=Student&background=random" alt="Profile" class="w-32 h-32 rounded-full object-cover border-4 border-indigo-50 shadow-md">
                    <label for="image-upload" class="absolute bottom-0 right-0 bg-indigo-600 text-white p-2 rounded-full shadow hover:bg-indigo-700 transition cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        <input type="file" id="image-upload" accept="image/*" class="hidden">
                    </label>
                </div>

                <!-- User Info -->
                <div class="flex-1 text-center md:text-left">
                    <h2 id="user-name" class="text-2xl font-bold text-gray-900">Loading Name...</h2>
                    <p id="user-email" class="text-gray-500 mb-4">loading@email.com</p>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-6 text-sm">
                        <div class="bg-gray-50 p-4 rounded-lg border border-gray-100">
                            <span class="block text-gray-400 text-xs uppercase tracking-wider mb-1">Role</span>
                            <span class="font-semibold text-gray-700">Student</span>
                        </div>
                        <div class="bg-gray-50 p-4 rounded-lg border border-gray-100">
                            <span class="block text-gray-400 text-xs uppercase tracking-wider mb-1">Status</span>
                            <span class="font-semibold text-green-600">Active</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- HIDDEN ID CARD TEMPLATE (Used for rendering the image) -->
        <div id="id-card-export-container">
            <div id="id-card-dom" class="w-[350px] bg-white rounded-2xl shadow-2xl overflow-hidden border border-gray-200 relative">
                <div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-r from-indigo-600 to-purple-600"></div>
                <div class="relative pt-6 pb-2 text-center z-10">
                    <h2 class="text-white font-extrabold text-2xl tracking-widest drop-shadow-md">TESTIFY</h2>
                    <p class="text-indigo-100 text-xs font-medium uppercase tracking-wider mt-1">Official Student ID</p>
                </div>
                <div class="relative px-6 pb-6 pt-4 flex flex-col items-center bg-white mt-4 rounded-t-[2rem]">
                    <img id="card-render-image" class="w-24 h-24 rounded-full border-4 border-white shadow-lg -mt-14 object-cover bg-gray-100 relative z-20" src="" alt="Profile">
                    <h3 id="card-render-name" class="mt-3 font-bold text-xl text-gray-800">Student Name</h3>
                    <p id="card-render-email" class="text-sm text-gray-500 mb-1">student@email.com</p>
                    <p class="text-xs font-bold text-indigo-600 bg-indigo-50 border border-indigo-100 px-4 py-1 rounded-full mb-5 mt-2">STUDENT</p>
                    <div class="flex flex-col items-center w-full border-t border-gray-100 pt-5 mt-2">
                        <div id="card-render-qr" class="p-2 bg-white border-2 border-gray-100 rounded-xl shadow-sm"></div>
                        <p class="text-[10px] text-gray-400 mt-3 text-center uppercase tracking-wider font-semibold">Scan to View Reports</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Image Crop Modal -->
        <div id="imageCropModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden">
                <div class="p-4 border-b flex justify-between items-center">
                    <h3 class="font-bold text-lg">Crop Profile Picture</h3>
                    <button id="closeCropModal" class="text-gray-500 hover:text-gray-700">&times;</button>
                </div>
                <div class="p-4">
                    <div class="w-full h-64 bg-gray-100 relative">
                        <img id="cropImage" src="" alt="To Crop" class="max-w-full max-h-full">
                    </div>
                </div>
                <div class="p-4 border-t flex justify-end gap-2">
                    <button id="cancelCrop" class="px-4 py-2 border rounded-lg hover:bg-gray-50">Cancel</button>
                    <button id="saveCrop" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Confirm & Upload</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Cropper.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <script>
        // Load User Data
        document.addEventListener('DOMContentLoaded', () => {
            let user = JSON.parse(localStorage.getItem('user'));
            
            // Fallback
            if(!user) {
                user = { name: "Student User", email: "student@example.com" };
            }

            document.getElementById('user-name').textContent = user.name || "Student Name";
            document.getElementById('user-email').textContent = user.email || "student@email.com";
            
            const profileImgUrl = user.profileImageUrl || `https://ui-avatars.com/api/?name=${user.name}&background=random`;
            document.getElementById('profile-image').src = profileImgUrl;
        });

        // Generate ID Card Function
        function generateIDCard() {
            const btn = document.querySelector('button[onclick="generateIDCard()"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Generating...';
            btn.disabled = true;

            const user = JSON.parse(localStorage.getItem('user')) || { name: document.getElementById('user-name').textContent, email: document.getElementById('user-email').textContent };

            document.getElementById('card-render-name').textContent = user.name || "Student Name";
            document.getElementById('card-render-email').textContent = user.email || "student@email.com";
            
            const imgEl = document.getElementById('card-render-image');
            imgEl.crossOrigin = "Anonymous";
            const existingImg = document.getElementById('profile-image');
            imgEl.src = existingImg ? existingImg.src : (user.profileImageUrl || `https://ui-avatars.com/api/?name=${user.name}`);

            const qrContainer = document.getElementById('card-render-qr');
            qrContainer.innerHTML = ""; 
            
            const verifyUrl = `${window.location.origin}/verify-reports.html?email=${encodeURIComponent(user.email)}`;
            
            new QRCode(qrContainer, {
                text: verifyUrl,
                width: 110,
                height: 110,
                colorDark : "#1e1b4b",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            setTimeout(() => {
                const cardDom = document.getElementById('id-card-dom');
                html2canvas(cardDom, { scale: 3, useCORS: true, backgroundColor: null, logging: false })
                .then(canvas => {
                    const link = document.createElement('a');
                    link.download = `Testify_ID_${user.name ? user.name.replace(/\s+/g, '_') : 'card'}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }).catch(err => {
                    console.error(err);
                    alert("Failed to generate ID card.");
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                });
            }, 500); 
        }

        // --- ORIGINAL CROPPER LOGIC ---
        let cropper;
        const imageUpload = document.getElementById('image-upload');
        const imageCropModal = document.getElementById('imageCropModal');
        const cropImage = document.getElementById('cropImage');
        const closeCropModalBtn = document.getElementById('closeCropModal');
        const cancelCropBtn = document.getElementById('cancelCrop');
        const saveButton = document.getElementById('saveCrop');

        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    cropImage.src = event.target.result;
                    imageCropModal.classList.remove('hidden');
                    
                    if (cropper) cropper.destroy();
                    
                    cropper = new Cropper(cropImage, {
                        aspectRatio: 1,
                        viewMode: 1,
                    });
                };
                reader.readAsDataURL(file);
            }
            e.target.value = ''; // Reset
        });

        const closeModal = () => {
            imageCropModal.classList.add('hidden');
            if (cropper) cropper.destroy();
        };

        closeCropModalBtn.addEventListener('click', closeModal);
        cancelCropBtn.addEventListener('click', closeModal);

        saveButton.addEventListener('click', () => {
            if (!cropper) return;
            
            saveButton.disabled = true;
            saveButton.textContent = 'Uploading...';

            cropper.getCroppedCanvas({
                width: 400,
                height: 400
            }).toBlob(blob => {
                const formData = new FormData();
                formData.append('profileImage', blob, 'profile.jpg');
                
                const token = localStorage.getItem('token'); // Assuming you use token based auth

                fetch('/api/student/profile/image', {
                    method: 'POST',
                    headers: { 'x-auth-token': token },
                    body: formData
                })
                .then(res => {
                    if(!res.ok) return res.json().then(err => Promise.reject(err));
                    return res.json();
                })
                .then(data => {
                    alert('Profile image uploaded successfully!');
                    document.getElementById('profile-image').src = data.imageUrl;
                    
                    const localUser = JSON.parse(localStorage.getItem('user'));
                    if(localUser) {
                        localUser.profileImageUrl = data.imageUrl;
                        localStorage.setItem('user', JSON.stringify(localUser));
                    }

                    imageCropModal.classList.add('hidden');
                    if (cropper) cropper.destroy();
                })
                .catch(err => {
                    alert(`Error: ${err.message}`);
                })
                .finally(() => {
                    saveButton.disabled = false;
                    saveButton.textContent = 'Confirm & Upload';
                });
            }, 'image/jpeg');
        });
    </script>
</body>
</html>
