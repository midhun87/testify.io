<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Ready - TESTIFY</title>
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/dpz44zf0z/image/upload/v1756037774/Gemini_Generated_Image_eu0ib0eu0ib0eu0i_z0amjh.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc;
        }

        /* Animated Background Blobs */
        .blob {
            position: absolute;
            filter: blur(90px);
            z-index: 0;
            opacity: 0.5;
            animation: float 15s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.1) translate(3%, 3%); }
            100% { transform: scale(0.9) translate(-3%, -3%); }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(226, 232, 240, 0.5);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Entry Animation with Stagger */
        .fade-in-up {
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* --- Advanced Exit & Success Animations --- */
        .page-exit {
            animation: pageExit 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            pointer-events: none;
        }
        @keyframes pageExit {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.92) translateY(-20px); }
        }

        .takeover-circle {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 2vw;
            height: 2vw;
            border-radius: 50%;
            background-color: #4f46e5; /* Indigo 600 */
            transform: translate(-50%, -50%) scale(0);
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transition: transform 0.8s cubic-bezier(0.64, 0, 0.78, 0), opacity 0.3s ease;
        }
        .takeover-active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(150);
        }

        .animate-bounce-in {
            animation: bounceIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform: scale(0);
        }
        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* Custom Input Styling */
        .form-input {
            transition: all 0.2s ease-in-out;
        }
        .form-input:focus {
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="relative flex flex-col min-h-screen overflow-hidden selection:bg-indigo-100 selection:text-indigo-900">

    <!-- Screen Takeover Element -->
    <div id="takeover" class="takeover-circle"></div>
    
    <!-- Success Icon Overlay -->
    <div id="success-overlay" class="fixed inset-0 z-[60] flex flex-col items-center justify-center pointer-events-none opacity-0 transition-opacity duration-300 hidden">
        <div class="bg-white/20 p-6 rounded-full backdrop-blur-sm mb-4">
            <svg class="w-20 h-20 text-white animate-bounce-in" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
        </div>
        <h2 class="text-white text-3xl font-bold tracking-tight animate-bounce-in" style="animation-delay: 0.1s;">Starting...</h2>
    </div>

    <!-- Animated Background Elements -->
    <div class="blob bg-indigo-200 w-[500px] h-[500px] rounded-full top-[-10%] left-[-10%]"></div>
    <div class="blob bg-purple-200 w-[400px] h-[400px] rounded-full bottom-[-10%] right-[10%]" style="animation-delay: -5s;"></div>

    <!-- Header with Home Buttons -->
    <header id="main-header" class="relative z-10 w-full p-6 lg:p-8 flex justify-between items-center transition-opacity duration-300">
        <a href="https://testify.xetasolutions.in" class="flex items-center space-x-3 group outline-none">
            <div class="relative overflow-hidden rounded-xl bg-white p-1.5 shadow-sm border border-slate-100">
                <img class="h-6 w-6 sm:h-8 sm:w-8 object-cover transition-transform duration-500 group-hover:scale-105" src="https://res.cloudinary.com/dpz44zf0z/image/upload/v1756037774/Gemini_Generated_Image_eu0ib0eu0ib0eu0i_z0amjh.png" alt="TESTIFY Logo">
            </div>
            <span class="text-xl font-bold text-slate-800 tracking-tight group-hover:text-indigo-600 transition-colors">TESTIFY</span>
        </a>

        <a href="https://testify.xetasolutions.in" class="flex items-center gap-2 px-4 py-2.5 bg-white/70 backdrop-blur-md border border-slate-200/60 text-slate-600 font-semibold rounded-full hover:bg-white hover:text-indigo-600 hover:shadow-md transition-all duration-300 shadow-sm group">
            <svg class="w-4 h-4 transition-transform group-hover:-translate-y-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            <span class="hidden sm:inline">Home</span>
        </a>
    </header>

    <!-- Main Content Centered -->
    <main id="main-content" class="relative z-10 flex-grow flex items-center justify-center px-4 sm:px-6 py-8">
        <div class="w-full max-w-xl fade-in-up">
            <div class="glass-card p-8 sm:p-10 rounded-[2rem]">
                
                <!-- Quiz Header Info -->
                <div class="text-center mb-8 fade-in-up delay-100">
                    <img id="quiz-logo" src="https://res.cloudinary.com/dpz44zf0z/image/upload/v1760086493/QuizCom_u5wzcp.png" alt="Quiz Logo" class="h-14 sm:h-16 w-auto mx-auto mb-4 object-contain drop-shadow-sm transition-all duration-500">
                    <h1 id="quiz-title-header" class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight mb-2">Quiz Starting Soon!</h1>
                    <p class="text-sm sm:text-base text-slate-500 font-medium">Please fill in your details to continue.</p>
                </div>
                
                <form id="student-details-form" class="space-y-5">
                    
                    <div class="fade-in-up delay-200">
                        <label for="full-name" class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1">Full Name</label>
                        <input type="text" id="full-name" required placeholder="John Doe" class="form-input w-full px-4 py-3 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 outline-none shadow-sm text-slate-800 font-medium placeholder-slate-400">
                    </div>
                    
                    <div class="fade-in-up delay-200">
                        <label for="email" class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1">Email Address</label>
                        <input type="email" id="email" required placeholder="john@example.com" class="form-input w-full px-4 py-3 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 outline-none shadow-sm text-slate-800 font-medium placeholder-slate-400">
                    </div>

                    <!-- 2-Column Grid for shorter inputs -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 fade-in-up delay-300">
                        <div>
                            <label for="roll-number" class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1">Roll Number</label>
                            <input type="text" id="roll-number" required placeholder="e.g. 21CS001" class="form-input w-full px-4 py-3 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 outline-none shadow-sm text-slate-800 font-medium placeholder-slate-400">
                        </div>
                        <div>
                            <label for="department-name" class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1">Department</label>
                            <input type="text" id="department-name" required placeholder="Computer Science" class="form-input w-full px-4 py-3 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 outline-none shadow-sm text-slate-800 font-medium placeholder-slate-400">
                        </div>
                    </div>

                    <div class="fade-in-up delay-300">
                        <label for="college-name" class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1">College Name</label>
                        <input type="text" id="college-name" required placeholder="University Name" class="form-input w-full px-4 py-3 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 outline-none shadow-sm text-slate-800 font-medium placeholder-slate-400">
                    </div>

                    <div class="pt-4 fade-in-up delay-300">
                        <button type="submit" id="submit-btn" class="relative flex items-center justify-center w-full py-4 bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 hover:bg-indigo-700 hover:shadow-indigo-600/50 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300 overflow-hidden disabled:opacity-70 disabled:cursor-not-allowed disabled:hover:-translate-y-0 disabled:shadow-none">
                            <span id="btn-text" class="flex items-center gap-2 transition-opacity duration-200">
                                Enter Quiz
                                <svg class="w-5 h-5 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </span>
                            
                            <!-- Loading Spinner -->
                            <svg id="btn-spinner" class="hidden animate-spin h-5 w-5 text-white absolute" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer id="main-footer" class="relative z-10 w-full p-6 text-center transition-opacity duration-300">
        <div class="flex items-center justify-center space-x-2 text-slate-500 text-sm font-medium">
            <span>Powered by</span>
            <img class="h-4 object-contain opacity-80 hover:opacity-100 transition-opacity grayscale hover:grayscale-0" src="https://res.cloudinary.com/dpz44zf0z/image/upload/v1760704788/XETA_SOLUTIONS_LOGO_bcsbwh.png" alt="XETA Solutions">
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const quizLogoEl = document.getElementById('quiz-logo');
            const quizTitleHeaderEl = document.getElementById('quiz-title-header');
            const form = document.getElementById('student-details-form');
            
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            
            const mainContent = document.getElementById('main-content');
            const mainHeader = document.getElementById('main-header');
            const mainFooter = document.getElementById('main-footer');
            const takeover = document.getElementById('takeover');
            const successOverlay = document.getElementById('success-overlay');
            
            let liveQuizId = localStorage.getItem('liveQuizId');
            const urlParams = new URLSearchParams(window.location.search);
            const quizCode = urlParams.get('code');

            if (!liveQuizId && !quizCode) {
                alert('Could not find a quiz to join. Redirecting...');
                window.location.href = 'quiz-join.html';
                return;
            }

            if (!liveQuizId && quizCode) {
                 try {
                    const response = await fetch('/api/quizcom/join-by-code', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ quizCode })
                    });
                    if (!response.ok) throw new Error('Invalid or expired quiz code.');
                    const data = await response.json();
                    liveQuizId = data.liveQuizId;
                    localStorage.setItem('liveQuizId', liveQuizId);
                } catch (err) {
                    alert(err.message);
                    window.location.href = 'quiz-join.html';
                    return;
                }
            }

            // Fetch quiz details to display logo and title
            try {
                const res = await fetch(`/api/quizcom/live/${liveQuizId}/details`);
                const data = await res.json();
                if (data.logoUrl) {
                    // Slight fade effect when logo loads
                    quizLogoEl.style.opacity = 0;
                    setTimeout(() => {
                        quizLogoEl.src = data.logoUrl;
                        quizLogoEl.style.opacity = 1;
                    }, 200);
                }
                if (data.title) {
                    quizTitleHeaderEl.textContent = data.title;
                }
            } catch (error) {
                console.error('Failed to load quiz details', error);
            }

            // Success Transition Logic
            const triggerSuccessTransition = () => {
                // 1. Initial Button Success State
                submitBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
                submitBtn.classList.add('bg-emerald-500', 'hover:bg-emerald-600', 'shadow-emerald-500/40');
                
                btnSpinner.classList.add('hidden');
                btnText.innerHTML = `
                    Ready!
                    <svg class="w-6 h-6 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                `;
                btnText.classList.remove('opacity-0');

                // Disable inputs
                document.querySelectorAll('.form-input').forEach(input => {
                    input.disabled = true;
                    input.classList.add('opacity-70');
                });

                // 2. Start page exit animation
                setTimeout(() => {
                    mainContent.classList.add('page-exit');
                    mainHeader.classList.add('opacity-0');
                    mainFooter.classList.add('opacity-0');
                    
                    // 3. Screen takeover effect expanding from the center
                    setTimeout(() => {
                        takeover.classList.add('takeover-active');
                        
                        // 4. Show bouncing icon overlay
                        setTimeout(() => {
                            successOverlay.classList.remove('hidden');
                            successOverlay.classList.remove('opacity-0');
                            
                            // 5. Final Redirect
                            setTimeout(() => {
                                window.location.href = 'quiz-active.html';
                            }, 1500);
                            
                        }, 400); 
                    }, 300); 
                }, 700); 
            };

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Set loading state
                submitBtn.disabled = true;
                btnText.classList.add('opacity-0');
                btnSpinner.classList.remove('hidden');
                
                const studentDetails = {
                    fullName: document.getElementById('full-name').value,
                    email: document.getElementById('email').value,
                    rollNumber: document.getElementById('roll-number').value,
                    collegeName: document.getElementById('college-name').value,
                    departmentName: document.getElementById('department-name').value,
                };
                
                // Simulate network delay for saving details to show off loading state
                setTimeout(() => {
                    localStorage.setItem('studentDetails', JSON.stringify(studentDetails));
                    triggerSuccessTransition();
                }, 800);
            });
        });
    </script>
</body>
</html>
