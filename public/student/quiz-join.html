<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Quiz - TESTIFY</title>
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/dpz44zf0z/image/upload/v1756037774/Gemini_Generated_Image_eu0ib0eu0ib0eu0i_z0amjh.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc;
        }

        /* Animated Background Blobs */
        .blob {
            position: absolute;
            filter: blur(90px);
            z-index: 0;
            opacity: 0.5;
            animation: float 15s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.1) translate(3%, 3%); }
            100% { transform: scale(0.9) translate(-3%, -3%); }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(226, 232, 240, 0.5);
        }

        /* Error Shake Animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Entry Animation */
        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Custom Input Hide Arrows */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="relative flex flex-col min-h-screen overflow-hidden selection:bg-indigo-100 selection:text-indigo-900">

    <!-- Animated Background Elements -->
    <div class="blob bg-indigo-200 w-[500px] h-[500px] rounded-full top-[-10%] left-[-10%]"></div>
    <div class="blob bg-purple-200 w-[400px] h-[400px] rounded-full bottom-[-10%] right-[10%]" style="animation-delay: -5s;"></div>

    <!-- Minimal Header -->
    <header class="relative z-10 w-full p-6 lg:p-8 flex justify-between items-center">
        <a href="../welcome.html" class="flex items-center space-x-3 group outline-none">
            <div class="relative overflow-hidden rounded-xl bg-white p-1.5 shadow-sm border border-slate-100">
                <img class="h-6 w-6 sm:h-8 sm:w-8 object-cover transition-transform duration-500 group-hover:scale-105" src="https://res.cloudinary.com/dpz44zf0z/image/upload/v1756037774/Gemini_Generated_Image_eu0ib0eu0ib0eu0i_z0amjh.png" alt="TESTIFY Logo">
            </div>
            <span class="text-xl font-bold text-slate-800 tracking-tight group-hover:text-indigo-600 transition-colors">TESTIFY</span>
        </a>
    </header>

    <!-- Main Content Centered -->
    <main class="relative z-10 flex-grow flex items-center justify-center px-4 sm:px-6">
        <div class="w-full max-w-md fade-in-up">
            <div class="glass-card p-8 sm:p-10 rounded-[2rem] text-center">
                
                <!-- QuizCom Logo -->
                <div class="mb-8 flex justify-center">
                    <img class="h-10 sm:h-12 w-auto object-contain" src="https://res.cloudinary.com/dpz44zf0z/image/upload/v1760086493/QuizCom_u5wzcp.png" alt="QuizCom Logo">
                </div>
                
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight mb-2">Join Session</h1>
                <p class="text-sm sm:text-base text-slate-500 mb-8 font-medium">Enter the 6-digit access code provided by your instructor or host.</p>
                
                <form id="join-quiz-form" class="relative">
                    
                    <!-- 6-Digit Premium Input -->
                    <div id="otp-container" class="flex justify-between gap-2 sm:gap-3 mb-6 dir-ltr">
                        <input type="text" maxlength="1" class="code-input w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl sm:text-3xl font-bold text-slate-900 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all outline-none shadow-sm placeholder-slate-300" placeholder="·" required>
                        <input type="text" maxlength="1" class="code-input w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl sm:text-3xl font-bold text-slate-900 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all outline-none shadow-sm placeholder-slate-300" placeholder="·" required>
                        <input type="text" maxlength="1" class="code-input w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl sm:text-3xl font-bold text-slate-900 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all outline-none shadow-sm placeholder-slate-300" placeholder="·" required>
                        <input type="text" maxlength="1" class="code-input w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl sm:text-3xl font-bold text-slate-900 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all outline-none shadow-sm placeholder-slate-300" placeholder="·" required>
                        <input type="text" maxlength="1" class="code-input w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl sm:text-3xl font-bold text-slate-900 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all outline-none shadow-sm placeholder-slate-300" placeholder="·" required>
                        <input type="text" maxlength="1" class="code-input w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl sm:text-3xl font-bold text-slate-900 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all outline-none shadow-sm placeholder-slate-300" placeholder="·" required>
                    </div>

                    <!-- Hidden input to store combined code for form submission logic if needed -->
                    <input type="hidden" id="quiz-code-full" name="quizCode">

                    <!-- Error Message Container -->
                    <div class="h-6 mb-4">
                        <p id="error-message" class="text-rose-500 text-sm font-semibold tracking-wide opacity-0 transition-opacity duration-300"></p>
                    </div>

                    <!-- Submit Button with Loading State -->
                    <button type="submit" id="submit-btn" class="relative flex items-center justify-center w-full py-4 bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 hover:bg-indigo-700 hover:shadow-indigo-600/50 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300 overflow-hidden disabled:opacity-70 disabled:cursor-not-allowed disabled:hover:-translate-y-0">
                        <span id="btn-text" class="flex items-center gap-2">
                            Join Session
                            <svg class="w-5 h-5 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </span>
                        
                        <!-- Loading Spinner (Hidden by default) -->
                        <svg id="btn-spinner" class="hidden animate-spin h-5 w-5 text-white absolute" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 w-full p-6 text-center">
        <div class="flex items-center justify-center space-x-2 text-slate-500 text-sm font-medium">
            <span>Powered by</span>
            <img class="h-4 object-contain opacity-80 hover:opacity-100 transition-opacity grayscale hover:grayscale-0" src="https://res.cloudinary.com/dpz44zf0z/image/upload/v1760704788/XETA_SOLUTIONS_LOGO_bcsbwh.png" alt="XETA Solutions">
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.code-input');
            const form = document.getElementById('join-quiz-form');
            const errorMessageEl = document.getElementById('error-message');
            const otpContainer = document.getElementById('otp-container');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            // Focus first input on load
            setTimeout(() => inputs[0].focus(), 100);

            // Logic for 6-digit OTP input behavior
            inputs.forEach((input, index) => {
                // Restrict input to numbers only
                input.addEventListener('input', (e) => {
                    input.value = input.value.replace(/[^0-9]/g, '');
                    
                    if (input.value !== '') {
                        errorMessageEl.classList.add('opacity-0'); // Hide error on type
                        input.classList.remove('border-rose-500', 'ring-rose-500/20');
                        
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        }
                    }
                });

                // Handle backspace and arrow keys
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && input.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    } else if (e.key === 'ArrowRight' && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    } else if (e.key === 'ArrowLeft' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });

                // Handle paste event across all inputs
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
                    
                    if (pastedData) {
                        for (let i = 0; i < pastedData.length; i++) {
                            if (i < inputs.length) {
                                inputs[i].value = pastedData[i];
                            }
                        }
                        // Focus the next empty input or the last one
                        const focusIndex = Math.min(pastedData.length, inputs.length - 1);
                        inputs[focusIndex].focus();
                        
                        // If full, try submitting
                        if (pastedData.length === 6) {
                             // Optional: form.dispatchEvent(new Event('submit'));
                        }
                    }
                });
            });

            // Set loading state UI
            const setLoading = (isLoading) => {
                inputs.forEach(input => input.disabled = isLoading);
                submitBtn.disabled = isLoading;
                
                if (isLoading) {
                    btnText.classList.add('opacity-0');
                    btnSpinner.classList.remove('hidden');
                } else {
                    btnText.classList.remove('opacity-0');
                    btnSpinner.classList.add('hidden');
                }
            };

            // Show error state UI
            const showError = (message) => {
                errorMessageEl.textContent = message;
                errorMessageEl.classList.remove('opacity-0');
                
                otpContainer.classList.add('shake');
                inputs.forEach(input => {
                    input.classList.add('border-rose-500', 'ring-rose-500/20');
                });
                
                // Remove shake class after animation completes so it can trigger again
                setTimeout(() => {
                    otpContainer.classList.remove('shake');
                }, 500);
            };

            // Form Submit Logic
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Combine the 6 inputs
                let code = '';
                inputs.forEach(input => code += input.value);

                if (code.length !== 6 || !/^\d{6}$/.test(code)) {
                    showError('Please enter a valid 6-digit code.');
                    inputs.forEach(input => { if(!input.value) input.classList.add('border-rose-500'); });
                    return;
                }

                // UI Loading State
                setLoading(true);
                errorMessageEl.classList.add('opacity-0');

                try {
                    // Slight artificial delay to show the nice animation (optional, remove in prod if desired)
                    await new Promise(resolve => setTimeout(resolve, 600));

                    const response = await fetch('/api/quizcom/join', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ quizCode: code })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || 'Invalid code or failed to connect.');
                    }

                    // Success - redirecting
                    localStorage.setItem('liveQuizId', data.liveQuizId);
                    window.location.href = `quiz-start.html`;

                } catch (error) {
                    // Revert UI on error
                    setLoading(false);
                    showError(error.message);
                    inputs[0].focus(); // Refocus first input
                }
            });
        });
    </script>
</body>
</html>
