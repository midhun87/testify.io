<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Quiz - TESTIFY</title>
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/dpz44zf0z/image/upload/v1756037774/Gemini_Generated_Image_eu0ib0eu0ib0eu0i_z0amjh.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc;
        }

        /* Animated Background Blobs */
        .blob {
            position: absolute;
            filter: blur(90px);
            z-index: 0;
            opacity: 0.5;
            animation: float 15s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.1) translate(3%, 3%); }
            100% { transform: scale(0.9) translate(-3%, -3%); }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(226, 232, 240, 0.5);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Error Shake Animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Success Pulse Animation */
        @keyframes successPulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .success-pulse {
            animation: successPulse 0.8s ease-out forwards;
        }

        /* Entry Animation */
        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Custom Input Hide Arrows */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* --- NEW: Advanced Exit & Success Animations --- */
        
        .page-exit {
            animation: pageExit 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            pointer-events: none;
        }
        @keyframes pageExit {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.92) translateY(-20px); }
        }

        .takeover-circle {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 2vw;
            height: 2vw;
            border-radius: 50%;
            background-color: #10b981; /* Emerald 500 */
            transform: translate(-50%, -50%) scale(0);
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transition: transform 0.8s cubic-bezier(0.64, 0, 0.78, 0), opacity 0.3s ease;
        }
        .takeover-active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(150); /* Expands to cover screen */
        }

        .animate-bounce-in {
            animation: bounceIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform: scale(0);
        }
        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="relative flex flex-col min-h-screen overflow-hidden selection:bg-indigo-100 selection:text-indigo-900">

    <!-- Screen Takeover Element (Activated on Success) -->
    <div id="takeover" class="takeover-circle"></div>
    
    <!-- Success Icon Overlay (Activated on Success) -->
    <div id="success-overlay" class="fixed inset-0 z-[60] flex flex-col items-center justify-center pointer-events-none opacity-0 transition-opacity duration-300 hidden">
        <div class="bg-white/20 p-6 rounded-full backdrop-blur-sm mb-4">
            <svg class="w-20 h-20 text-white animate-bounce-in" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        <h2 class="text-white text-3xl font-bold tracking-tight animate-bounce-in" style="animation-delay: 0.1s;">Connecting...</h2>
    </div>

    <!-- Animated Background Elements -->
    <div class="blob bg-indigo-200 w-[500px] h-[500px] rounded-full top-[-10%] left-[-10%]"></div>
    <div class="blob bg-purple-200 w-[400px] h-[400px] rounded-full bottom-[-10%] right-[10%]" style="animation-delay: -5s;"></div>

    <!-- Header with Home Buttons -->
    <header id="main-header" class="relative z-10 w-full p-6 lg:p-8 flex justify-between items-center transition-opacity duration-300">
        <!-- Logo Link updated to Home -->
        <a href="https://testify.xetasolutions.in" class="flex items-center space-x-3 group outline-none">
            <div class="relative overflow-hidden rounded-xl bg-white p-1.5 shadow-sm border border-slate-100">
                <img class="h-6 w-6 sm:h-8 sm:w-8 object-cover transition-transform duration-500 group-hover:scale-105" src="https://res.cloudinary.com/dpz44zf0z/image/upload/v1756037774/Gemini_Generated_Image_eu0ib0eu0ib0eu0i_z0amjh.png" alt="TESTIFY Logo">
            </div>
            <span class="text-xl font-bold text-slate-800 tracking-tight group-hover:text-indigo-600 transition-colors">TESTIFY</span>
        </a>

        <!-- Explicit Home Button -->
        <a href="https://testify.xetasolutions.in" class="flex items-center gap-2 px-4 py-2.5 bg-white/70 backdrop-blur-md border border-slate-200/60 text-slate-600 font-semibold rounded-full hover:bg-white hover:text-indigo-600 hover:shadow-md transition-all duration-300 shadow-sm group">
            <svg class="w-4 h-4 transition-transform group-hover:-translate-y-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            <span class="hidden sm:inline">Home</span>
        </a>
    </header>

    <!-- Main Content Centered -->
    <main id="main-content" class="relative z-10 flex-grow flex items-center justify-center px-4 sm:px-6">
        <div class="w-full max-w-md fade-in-up">
            <div id="join-card" class="glass-card p-8 sm:p-10 rounded-[2rem] text-center">
                
                <!-- QuizCom Logo -->
                <div class="mb-8 flex justify-center">
                    <img class="h-10 sm:h-12 w-auto object-contain" src="https://res.cloudinary.com/dpz44zf0z/image/upload/v1760086493/QuizCom_u5wzcp.png" alt="QuizCom Logo">
                </div>
                
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight mb-2">Join Session</h1>
                <p class="text-sm sm:text-base text-slate-500 mb-8 font-medium">Enter the 6-digit access code provided by your instructor or host.</p>
                
                <form id="join-quiz-form" class="relative">
                    
                    <!-- 6-Digit Premium Input -->
                    <div id="otp-container" class="flex justify-between gap-2 sm:gap-3 mb-6 dir-ltr rounded-xl">
                        <input type="text" inputmode="numeric" pattern="\d*" maxlength="1" class="code-input w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl sm:text-3xl font-bold text-slate-900 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all outline-none shadow-sm placeholder-slate-300" placeholder="·" required>
                        <input type="text" inputmode="numeric" pattern="\d*" maxlength="1" class="code-input w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl sm:text-3xl font-bold text-slate-900 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all outline-none shadow-sm placeholder-slate-300" placeholder="·" required>
                        <input type="text" inputmode="numeric" pattern="\d*" maxlength="1" class="code-input w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl sm:text-3xl font-bold text-slate-900 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all outline-none shadow-sm placeholder-slate-300" placeholder="·" required>
                        <input type="text" inputmode="numeric" pattern="\d*" maxlength="1" class="code-input w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl sm:text-3xl font-bold text-slate-900 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all outline-none shadow-sm placeholder-slate-300" placeholder="·" required>
                        <input type="text" inputmode="numeric" pattern="\d*" maxlength="1" class="code-input w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl sm:text-3xl font-bold text-slate-900 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all outline-none shadow-sm placeholder-slate-300" placeholder="·" required>
                        <input type="text" inputmode="numeric" pattern="\d*" maxlength="1" class="code-input w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl sm:text-3xl font-bold text-slate-900 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all outline-none shadow-sm placeholder-slate-300" placeholder="·" required>
                    </div>

                    <!-- Error Message Container -->
                    <div class="h-6 mb-4">
                        <p id="error-message" class="text-rose-500 text-sm font-semibold tracking-wide opacity-0 transition-opacity duration-300"></p>
                    </div>

                    <!-- Submit Button with Loading & Success States -->
                    <button type="submit" id="submit-btn" class="relative flex items-center justify-center w-full py-4 bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 hover:bg-indigo-700 hover:shadow-indigo-600/50 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300 overflow-hidden disabled:opacity-70 disabled:cursor-not-allowed disabled:hover:-translate-y-0 disabled:shadow-none">
                        <span id="btn-text" class="flex items-center gap-2 transition-opacity duration-200">
                            Join Session
                            <svg class="w-5 h-5 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </span>
                        
                        <!-- Loading Spinner (Hidden by default) -->
                        <svg id="btn-spinner" class="hidden animate-spin h-5 w-5 text-white absolute" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer id="main-footer" class="relative z-10 w-full p-6 text-center transition-opacity duration-300">
        <div class="flex items-center justify-center space-x-2 text-slate-500 text-sm font-medium">
            <span>Powered by</span>
            <img class="h-4 object-contain opacity-80 hover:opacity-100 transition-opacity grayscale hover:grayscale-0" src="https://res.cloudinary.com/dpz44zf0z/image/upload/v1760704788/XETA_SOLUTIONS_LOGO_bcsbwh.png" alt="XETA Solutions">
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.code-input');
            const form = document.getElementById('join-quiz-form');
            const errorMessageEl = document.getElementById('error-message');
            const otpContainer = document.getElementById('otp-container');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            // Elements for Transition Animation
            const mainContent = document.getElementById('main-content');
            const mainHeader = document.getElementById('main-header');
            const mainFooter = document.getElementById('main-footer');
            const takeover = document.getElementById('takeover');
            const successOverlay = document.getElementById('success-overlay');

            // Focus first input on load
            setTimeout(() => inputs[0].focus(), 100);

            // Logic for 6-digit OTP input behavior
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    input.value = input.value.replace(/[^0-9]/g, '');
                    
                    if (input.value !== '') {
                        errorMessageEl.classList.add('opacity-0'); 
                        input.classList.remove('border-rose-500', 'ring-rose-500/20');
                        
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        }
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && input.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    } else if (e.key === 'ArrowRight' && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    } else if (e.key === 'ArrowLeft' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });

                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
                    
                    if (pastedData) {
                        for (let i = 0; i < pastedData.length; i++) {
                            if (i < inputs.length) {
                                inputs[i].value = pastedData[i];
                            }
                        }
                        const focusIndex = Math.min(pastedData.length, inputs.length - 1);
                        inputs[focusIndex].focus();
                    }
                });
            });

            const setLoading = (isLoading) => {
                inputs.forEach(input => input.disabled = isLoading);
                submitBtn.disabled = isLoading;
                
                if (isLoading) {
                    btnText.classList.add('opacity-0');
                    btnSpinner.classList.remove('hidden');
                } else {
                    btnText.classList.remove('opacity-0');
                    btnSpinner.classList.add('hidden');
                }
            };

            const showError = (message) => {
                errorMessageEl.textContent = message;
                errorMessageEl.classList.remove('opacity-0');
                
                otpContainer.classList.add('shake');
                inputs.forEach(input => {
                    input.classList.add('border-rose-500', 'ring-rose-500/20');
                });
                
                setTimeout(() => {
                    otpContainer.classList.remove('shake');
                }, 500);
            };

            // High-End Success Validation State UI & Transition
            const triggerSuccessTransition = () => {
                // 1. Initial UI Success State inside the card
                submitBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
                submitBtn.classList.add('bg-emerald-500', 'hover:bg-emerald-600', 'shadow-emerald-500/40');
                
                btnSpinner.classList.add('hidden');
                btnText.innerHTML = `
                    Success!
                    <svg class="w-6 h-6 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                `;
                btnText.classList.remove('opacity-0');

                otpContainer.classList.add('success-pulse');
                inputs.forEach(input => {
                    input.classList.remove('focus:ring-indigo-500/20', 'focus:border-indigo-500');
                    input.classList.add('border-emerald-500', 'text-emerald-700', 'bg-emerald-50/50');
                });

                // 2. Start page exit animation after a brief pause
                setTimeout(() => {
                    mainContent.classList.add('page-exit');
                    mainHeader.classList.add('opacity-0');
                    mainFooter.classList.add('opacity-0');
                    
                    // 3. Screen takeover effect expanding from the center
                    setTimeout(() => {
                        takeover.classList.add('takeover-active');
                        
                        // 4. Show bouncing checkmark overlay
                        setTimeout(() => {
                            successOverlay.classList.remove('hidden');
                            successOverlay.classList.remove('opacity-0');
                            
                            // 5. Final Redirect
                            setTimeout(() => {
                                window.location.href = `quiz-start.html`;
                            }, 1500);
                            
                        }, 400); // Overlay appears slightly after background turns green
                    }, 300); // Circle takeover starts mid-way through card fading out
                }, 700); // Wait 700ms on the card success state so the user processes it
            };

            // Form Submit Logic
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                let code = '';
                inputs.forEach(input => code += input.value);

                if (code.length !== 6 || !/^\d{6}$/.test(code)) {
                    showError('Please enter a valid 6-digit code.');
                    inputs.forEach(input => { if(!input.value) input.classList.add('border-rose-500'); });
                    return;
                }

                setLoading(true);
                errorMessageEl.classList.add('opacity-0');

                try {
                    await new Promise(resolve => setTimeout(resolve, 500));

                    const response = await fetch('/api/quizcom/join', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ quizCode: code })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || 'Invalid code or failed to connect.');
                    }

                    // Store ID and Trigger immersive animation
                    localStorage.setItem('liveQuizId', data.liveQuizId);
                    triggerSuccessTransition();

                } catch (error) {
                    setLoading(false);
                    showError(error.message);
                    inputs[0].focus(); 
                }
            });
        });
    </script>
</body>
</html>
