<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Asset Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="p-4 flex flex-col h-screen max-w-md mx-auto">
    <header class="text-center py-4 border-b border-slate-200 mb-6">
        <h1 class="text-xl font-bold text-slate-900">Secure Environment Sync</h1>
        <p class="text-sm text-slate-500" id="sess-id">Session: Loading...</p>
    </header>

    <main class="flex-1 overflow-y-auto pb-24">
        <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-4 mb-6">
            <p class="text-sm text-indigo-800 font-medium">Please capture and upload clear photos of your testing environment walls. S3 direct upload enabled.</p>
        </div>

        <div class="space-y-4">
            <label class="block border-2 border-slate-200 border-dashed rounded-xl p-4 bg-white relative transition-colors">
                <span class="font-bold text-slate-700 block mb-1">Front Wall (Desk Area)</span>
                <span class="text-xs text-slate-500 block mb-3" id="lbl-front">Tap to capture image</span>
                <input type="file" accept="image/*" capture="environment" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="markDone(this, 'front')">
            </label>

            <label class="block border-2 border-slate-200 border-dashed rounded-xl p-4 bg-white relative transition-colors">
                <span class="font-bold text-slate-700 block mb-1">Back Wall (Behind You)</span>
                <span class="text-xs text-slate-500 block mb-3" id="lbl-back">Tap to capture image</span>
                <input type="file" accept="image/*" capture="environment" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="markDone(this, 'back')">
            </label>

            <label class="block border-2 border-slate-200 border-dashed rounded-xl p-4 bg-white relative transition-colors">
                <span class="font-bold text-slate-700 block mb-1">Left Wall</span>
                <span class="text-xs text-slate-500 block mb-3" id="lbl-left">Tap to capture image</span>
                <input type="file" accept="image/*" capture="environment" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="markDone(this, 'left')">
            </label>

            <label class="block border-2 border-slate-200 border-dashed rounded-xl p-4 bg-white relative transition-colors">
                <span class="font-bold text-slate-700 block mb-1">Right Wall</span>
                <span class="text-xs text-slate-500 block mb-3" id="lbl-right">Tap to capture image</span>
                <input type="file" accept="image/*" capture="environment" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="markDone(this, 'right')">
            </label>
        </div>
        
        <!-- UI Error display -->
        <p id="error-msg" class="hidden mt-4 p-3 bg-red-50 text-red-600 text-sm font-semibold rounded-lg text-center border border-red-200"></p>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-slate-200 max-w-md mx-auto z-10">
        <button onclick="submitToS3()" id="btn-submit" class="w-full py-4 bg-indigo-600 text-white font-bold rounded-xl shadow-lg hover:bg-indigo-700 active:scale-95 transition flex justify-center items-center h-[56px]">Upload to S3 & Sync Desktop</button>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const session = urlParams.get('session');
        if(session) document.getElementById('sess-id').textContent = `Session: ${session}`;
        
        let roomAssets = {};

        function markDone(input, angle) {
            if(input.files && input.files.length > 0) {
                // Store the actual file object
                roomAssets[angle] = input.files[0];
                
                // Update UI visually
                const el = document.getElementById(`lbl-${angle}`);
                el.textContent = "✓ Image Captured";
                el.classList.replace('text-slate-500', 'text-green-600');
                el.classList.add('font-bold');
                
                const card = input.parentElement;
                card.classList.replace('border-slate-200', 'border-green-400');
                card.classList.replace('bg-white', 'bg-green-50');
                
                // Hide error message if user fixes an issue
                document.getElementById('error-msg').classList.add('hidden');
            }
        }

        const getBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        async function submitToS3() {
            const errorDiv = document.getElementById('error-msg');
            errorDiv.classList.add('hidden');

            // Validate all 4 images exist
            if(!roomAssets.front || !roomAssets.back || !roomAssets.left || !roomAssets.right) {
                errorDiv.textContent = "Missing images. Please capture all 4 sides of the room before submitting.";
                errorDiv.classList.remove('hidden');
                return;
            }
            
            const btn = document.getElementById('btn-submit');
            btn.innerHTML = '<div class="w-6 h-6 border-4 border-t-white border-indigo-400 rounded-full animate-spin"></div>';
            btn.disabled = true;

            try {
                // Read all files as base64 strings to send to backend
                const payload = {
                    front: await getBase64(roomAssets.front),
                    back: await getBase64(roomAssets.back),
                    left: await getBase64(roomAssets.left),
                    right: await getBase64(roomAssets.right)
                };

                // Post to the backend endpoint which handles the S3 upload
                const res = await fetch(`/api/proctor/room-status/${session}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    // Replace screen with Success Confirmation
                    document.body.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-screen text-center p-6 bg-slate-50">
                            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-6 shadow-sm border border-green-200">
                                <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <h2 class="text-2xl font-bold text-slate-900 mb-2">Sync Complete</h2>
                            <p class="text-slate-600">Assets securely uploaded to AWS S3. Please look at your desktop screen to continue your exam.</p>
                        </div>
                    `;
                } else {
                    throw new Error(data.message || "Failed to sync assets with server.");
                }
            } catch (error) {
                console.error("Upload Error:", error);
                errorDiv.textContent = error.message || "Network error. Please check your connection and try again.";
                errorDiv.classList.remove('hidden');
                btn.textContent = "Upload to S3 & Sync Desktop";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
